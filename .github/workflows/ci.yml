name: Django CI Pipeline

on:
    push:
        branches: [ "main" ]
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest

        env:
            SECRET_KEY: ci-only-secret-key-not-for-production
            DEBUG: "False"
            ALLOWED_HOSTS: localhost,127.0.0.1

            DB_NAME: urban_issue_ci
            DB_USER: urban_issue_ci
            DB_PASSWORD: ci-only-database-password
            DB_HOST: localhost
            DB_PORT: 5432

        services:
            postgres:
                image: postgres:15
                env:
                    POSTGRES_DB: urban_issue_ci
                    POSTGRES_USER: urban_issue_ci
                    POSTGRES_PASSWORD: ci-only-database-password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd="pg_isready -U urban_issue_ci -d urban_issue_ci"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.12'

            - name: Cache dependencies
              uses: actions/cache@v4
              with:
                path: ~/.cache/pip
                key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

            - name: Install dependencies
              run: |
                pip install -r requirements.txt

            - name: Wait for PostgreSQL
              run: |
                until pg_isready -h localhost -p 5432 -U $DB_USER; do
                  echo "Waiting for database...";
                  sleep 2
                done

            - name: Run migrations
              run: |
                python app/manage.py migrate

            - name: Run Django system checks
              run: |
                python app/manage.py check

            - name: Run tests
              run: |
                python app/manage.py test

            - name: Build Docker image
              run: |
                docker build --tag urban-issue-api:ci .
                