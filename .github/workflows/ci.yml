name: Django CI Pipeline

on:
    push:
        branches: [ "main" ]
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest

        env:
            SECRET_KEY: ci-only-secret-key-not-for-production
            DEBUG: "False"
            ALLOWED_HOSTS: localhost,127.0.0.1

            DB_NAME: urban_issue_ci
            DB_USER: urban_issue_ci
            DB_PASSWORD: ci-only-database-password
            DB_HOST: localhost
            DB_PORT: 5432

        services:
            postgres:
                image: postgres:15
                env:
                    POSTGRES_DB: urban_issue_ci
                    POSTGRES_USER: urban_issue_ci
                    POSTGRES_PASSWORD: ci-only-database-password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd="pg_isready -U urban_issue_ci -d urban_issue_ci"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.12'

            - name: Cache dependencies
              uses: actions/cache@v4
              with:
                path: ~/.cache/pip
                key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}

            - name: Install dependencies
              run: |
                pip install -r requirements-dev.txt

            - name: Run Ruff linting
              run: |
                ruff check app

            - name: Check Ruff formatting
              run: |
                ruff format --check app

            - name: Wait for PostgreSQL
              run: |
                until pg_isready -h localhost -p 5432 -U $DB_USER; do
                  echo "Waiting for database...";
                  sleep 2
                done

            - name: Run migrations
              run: |
                python app/manage.py migrate

            - name: Run Django system checks
              run: |
                python app/manage.py check

            - name: Validate OpenAPI schema
              working-directory: app
              run: |
                python manage.py spectacular \
                    --file schema.yml \
                    --validate \
                    --fail-on-warn

            - name: Run tests with coverage
              working-directory: app
              run: |
                coverage run \
                  --rcfile=../.coveragerc \
                  manage.py test -v 2

                coverage report \
                  --rcfile=../.coveragerc \
                  --fail-under=95 \
                  -m

            - name: Build versioned Docker image
              run: |
                SHORT_SHA="${GITHUB_SHA::7}"

                docker build \
                  --build-arg APP_VERSION="$SHORT_SHA" \
                  --build-arg VCS_REF="$GITHUB_SHA" \
                  --tag "urban-issue-api:$SHORT_SHA" \
                  --tag urban-issue-api:ci \
                  .

            - name: Verify Docker image metadata
              run: |
                SHORT_SHA="${GITHUB_SHA::7}"

                VERSION="$(docker image inspect "urban-issue-api:$SHORT_SHA" --format='{{ index .Config.Labels "org.opencontainers.image.version" }}')"

                REVISION="$(docker image inspect "urban-issue-api:$SHORT_SHA" --format='{{ index .Config.Labels "org.opencontainers.image.revision" }}')"

                test "$VERSION" = "$SHORT_SHA"
                test "$REVISION" = "$GITHUB_SHA"

                echo "Image version: $VERSION"
                echo "Image revision: $REVISION"

    publish:
        name: Publish container image
        needs: build

        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        env:
            REGISTRY: ghcr.io
            IMAGE_NAME: ghcr.io/${{ github.repository }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Prepare image metadata
              id: image
              run: |
                SHORT_SHA="${GITHUB_SHA::7}"
                IMAGE_NAME="$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"

                echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
                echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

            - name: Log in to GitHub Container Registry
              run: |
                echo "${{ secrets.GITHUB_TOKEN }}" | \
                  docker login "$REGISTRY" \
                    --username "${{ github.actor }}" \
                    --password-stdin

            - name: Build release image
              run: |
                docker build \
                  --build-arg APP_VERSION="${{ steps.image.outputs.short_sha }}" \
                  --build-arg VCS_REF="$GITHUB_SHA" \
                  --tag "${{ steps.image.outputs.image_name }}:${{ steps.image.outputs.short_sha }}" \
                  --tag "${{ steps.image.outputs.image_name }}:latest" \
                  .

            - name: Push release image
              run: |
                docker push \
                  "${{ steps.image.outputs.image_name }}:${{ steps.image.outputs.short_sha }}"

                docker push \
                  "${{ steps.image.outputs.image_name }}:latest"

            - name: Verify published image
              run: |
                docker buildx imagetools inspect \
                  "${{ steps.image.outputs.image_name }}:${{ steps.image.outputs.short_sha }}"
